[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "unofficial-osmo-camera"
version = "0.2.0"
description = "Unofficial Osmo interoperability library Python testing wrapper"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[dependency-groups]
dev = ["maturin>=1.15,<2", "ruff>=0.17.3,<0.18"]

[[tool.uv.index]]
name = "microsoft-python"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.maturin]
python-source = "python"
module-name = "osmo_camera._native"
features = ["extension-module"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pdb"]
