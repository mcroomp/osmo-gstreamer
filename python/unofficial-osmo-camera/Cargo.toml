[package]
name = "unofficial-osmo-camera-python"
version = "0.2.0"
description = "Python bindings for unofficial Osmo camera interoperability"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/mcroomp/osmo-gstreamer"

[workspace]
resolver = "2"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]
stubgen = ["dep:pyo3-stub-gen"]

[[bin]]
name = "stub-gen"
path = "src/bin/stub-gen.rs"
required-features = ["stubgen"]

[dependencies]
unofficial-osmo-camera = { path = "../../crates/unofficial-osmo-camera" }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
pyo3-stub-gen = { version = "0.23.2", optional = true, default-features = false, features = ["infer_signature"] }
