version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directories:
      - /
      - /python/unofficial-osmo-camera
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /python/unofficial-osmo-camera
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
