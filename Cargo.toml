[workspace]
members = ["crates/unofficial-osmo-camera", "crates/gst-plugin-unofficial-osmo"]
default-members = ["crates/unofficial-osmo-camera"]
exclude = ["python/unofficial-osmo-camera"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Kristof Roomp"]
readme = "README.md"
homepage = "https://github.com/mcroomp/osmo-gstreamer"
repository = "https://github.com/mcroomp/osmo-gstreamer"

[workspace.dependencies]
gstreamer = { version = "0.25.4", features = ["log", "v1_24"] }
gstreamer-base = { version = "0.25.4", features = ["v1_24"] }
log = "0.4"
