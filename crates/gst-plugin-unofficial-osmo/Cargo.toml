[package]
name = "gst-plugin-unofficial-osmo"
description = "Unofficial Osmo Nano camera GStreamer source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/gst-plugin-unofficial-osmo"
keywords = ["osmo", "camera", "gstreamer", "interoperability", "video"]
categories = ["multimedia::video", "multimedia::encoding", "hardware-support"]
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "LICENSE"]

[lib]
name = "gstosmo"
crate-type = ["cdylib", "rlib"]

[dependencies]
unofficial-osmo-camera = { version = "=0.2.0", path = "../unofficial-osmo-camera" }
gstreamer.workspace = true
gstreamer-base.workspace = true
log.workspace = true
