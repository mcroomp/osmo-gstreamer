[package]
name = "unofficial-osmo-camera"
description = "Unofficial Rust library for Osmo Nano camera interoperability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/unofficial-osmo-camera"
keywords = ["osmo", "camera", "interoperability", "video"]
categories = ["multimedia::video", "hardware-support"]
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "LICENSE"]

[dependencies]
socket2 = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "1.1"
log.workspace = true
btleplug = "0.13.5"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
uuid = { version = "1", features = ["v4"] }
rpassword = "7"
env_logger = "0.11"
binrw = "0.15.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-route = "0.33"
rtnetlink = "0.23"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
