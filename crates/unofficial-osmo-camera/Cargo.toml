[package]
name = "unofficial-osmo-camera"
description = "Unofficial Rust library for Osmo Nano camera interoperability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/unofficial-osmo-camera"
keywords = ["osmo", "camera", "interoperability", "video"]
categories = ["multimedia::video", "hardware-support"]
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "LICENSE"]

[features]
default = []
ble = [
    "dep:btleplug",
    "dep:futures",
    "dep:netlink-packet-route",
    "dep:rpassword",
    "dep:rtnetlink",
    "dep:tokio",
    "dep:uuid",
    "dep:windows",
    "dep:env_logger",
]

[dependencies]
num_enum = "0.7.6"
socket2 = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "1.1"
log.workspace = true
btleplug = { version = "0.13.5", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
rpassword = { version = "7", optional = true }
env_logger = { version = "0.11", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-route = { version = "0.33", optional = true }
rtnetlink = { version = "0.23", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "osmo-pair"
path = "src/bin/osmo-pair.rs"
required-features = ["ble"]
